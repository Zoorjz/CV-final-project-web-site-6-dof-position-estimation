<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time 6D Pose Estimation of a Rigid Training Bar | CV Final Project</title>
  <meta name="description" content="Presentation and dual-pipeline synchronized comparison for real-time 6D pose estimation of a rigid training bar using geometry-based and data-driven approaches." />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/presentation.css" />
  <link rel="stylesheet" href="/src/styles/comparison.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <!-- Sticky Navigation Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand-group">
        <div class="brand-icon">6D</div>
        <div>
          <span class="brand-text">6D Pose Estimation</span>
          <span class="brand-subtext">| CV Final Project</span>
        </div>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="#presentation-root" class="nav-link">Presentation</a></li>
          <li><a href="#comparison-section" class="nav-link active-link">Interactive Comparison</a></li>
          <li><a href="#results-root" class="nav-link">Results</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-content">
    
    <!-- Part 1: Data-Driven Presentation & Report Section -->
    <div id="presentation-root" class="presentation-container">
      <!-- Injected dynamically via PresentationRenderer.js from presentationBlocks -->
    </div>

    <!-- Part 2: Interactive Synchronized Comparison Section -->
    <section id="comparison-section" class="comparison-section">
      <div class="section-anchor-header">
        <h2>Interactive Pipeline Comparison</h2>
        <div class="section-divider-line"></div>
      </div>

      <div class="comparison-wrapper">
        <!-- Master Video Synchronization Control Bar -->
        <div id="sync-control-bar"></div>

        <!-- Dual Side-by-Side Video Players Grid -->
        <div class="comparison-players-grid">
          <!-- Left: 3D Pipeline (PnP) -->
          <div id="player-pnp-container"></div>

          <!-- Right: Data Driven Pipeline (CNN / ML) -->
          <div id="player-data-container"></div>
        </div>
      </div>
    </section>

    <!-- Part 3: Performance & Robustness Results Section -->
    <div id="results-root" class="presentation-container" style="margin-top: 48px;">
      <!-- Injected dynamically via PresentationRenderer.js from resultsBlocks -->
    </div>

  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 Computer Vision Final Project — UTN Studies. Built with Vite & Vanilla JS.</p>
      <div class="footer-links">
        <a href="#presentation-root">Presentation</a>
        <a href="#comparison-section">Interactive Comparison</a>
        <a href="#results-root">Results</a>
      </div>
    </div>
  </footer>

  <!-- Application Bootstrap -->
  <script type="module" src="/src/main.js"></script>
</body>
